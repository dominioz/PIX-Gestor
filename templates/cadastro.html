<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Dominioz PIX Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="container nav-inner">
            <a class="logo" href="/">
                <img src="https://www.dominioz.com.br/img/logo.png" class="logo-img" alt="Dominioz">
            </a>
            <div class="nav-links d-flex">
                <a href="/" class="btn btn-primary btn-sm text-dark fw-bold">Voltar ao Login</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5 mt-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-panel p-5">
                    <h3 class="mb-2 fw-bold text-white text-center">Criar Conta Gratuita</h3>
                    <p class="text-light text-center mb-4">Até 5 gerações de QR Code.</p>
                    
                    <form action="/cadastro" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-white">Nome Completo</label>
                            <input type="text" name="nome" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">E-mail</label>
                            <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Senha</label>
                            <input type="password" name="senha" class="form-control bg-dark text-white border-secondary" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-white">Chave PIX Principal</label>
                            <input type="text" name="chave_pix" class="form-control bg-dark text-white border-secondary" required placeholder="CPF, E-mail ou Telefone">
                            
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 text-dark">Registrar e Receber Código para ativação</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
